<!DOCTYPE html>
<html>
<head>
  <title>Password Checker</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 400px; margin: 60px auto; }
    input { width: 50%; padding: 8px; font-size: 16px; }
    button { padding: 8px; font-size: 16px; }
    #bar-bg { background: #ddd; height: 10px; border-radius: 5px; margin-top: 15px; }
    #bar { height: 10px; width: 0%; border-radius: 5px; transition: width 0.3s; }
  </style>
</head>
<body>
  <h1>Password Checker</h1>
  <input type="password" id="pw" placeholder="Type a password">
  <button id="toggle">Show</button>
  <button id="generate">Generate</button>
  <div id="bar-bg"><div id="bar"></div></div>
  <p id="result">Start typing...</p>
  <p id="crack"></p>
  <p id="breach"></p>
  <ul id="tips"></ul>

  <script>
    const box = document.getElementById("pw");
    const result = document.getElementById("result");
    const bar = document.getElementById("bar");
    const toggle = document.getElementById("toggle");
    const breach = document.getElementById("breach");
    let timer;

    toggle.addEventListener("click", function () {
      if (box.type === "password") {
        box.type = "text";
        toggle.textContent = "Hide";
      } else {
        box.type = "password";
        toggle.textContent = "Show";
      }
    });

    // Turns text into a fingerprint (SHA-1 hash)
    async function sha1(text) {
      const data = new TextEncoder().encode(text);
      const hashBuffer = await crypto.subtle.digest("SHA-1", data);
      const bytes = Array.from(new Uint8Array(hashBuffer));
      return bytes.map(b => b.toString(16).padStart(2, "0")).join("").toUpperCase();
    }

    // Asks Have I Been Pwned if this password was leaked
    async function checkBreach(pw) {
      breach.style.color = "black";
      breach.textContent = "Checking data breaches...";
      try {
        const hash = await sha1(pw);
        const prefix = hash.slice(0, 5);
        const suffix = hash.slice(5);

        const response = await fetch("https://api.pwnedpasswords.com/range/" + prefix);
        const text = await response.text();

        let count = 0;
        for (const line of text.split("\n")) {
          const parts = line.trim().split(":");
          if (parts[0] === suffix) {
            count = parseInt(parts[1]);
            break;
          }
        }

        if (box.value !== pw) return; // user kept typing, ignore old result

        if (count > 0) {
          breach.style.color = "red";
          breach.textContent = "Leaked " + count.toLocaleString() + " times in data breaches. Do not use it!";
          document.getElementById("crack").textContent = "Estimated time to crack: instantly (it is already leaked)";
        } else {
          breach.style.color = "green";
          breach.textContent = "Not found in known data breaches.";
        }
      } catch (error) {
        breach.style.color = "gray";
        breach.textContent = "Could not check breaches (are you online?)";
      }
    }
    const generateBtn = document.getElementById("generate");

generateBtn.addEventListener("click", function () {
  const chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*";
  const randoms = crypto.getRandomValues(new Uint32Array(16));
  let pw = "";
  for (const r of randoms) {
    pw += chars[r % chars.length];
  }
  box.value = pw;
  box.type = "text";
  toggle.textContent = "Hide";
  box.dispatchEvent(new Event("input"));
});
    function crackTime(pw) {
  let pool = 0;
  if (/[a-z]/.test(pw)) pool += 26;
  if (/[A-Z]/.test(pw)) pool += 26;
  if (/[0-9]/.test(pw)) pool += 10;
  if (/[^a-zA-Z0-9]/.test(pw)) pool += 32;

  const guesses = Math.pow(pool, pw.length);
  const seconds = guesses / 1e10; // 10 billion guesses per second

  const minute = 60, hour = 3600, day = 86400, year = 31557600;

  if (seconds < 1) return "instantly";
  if (seconds < hour) return Math.round(seconds / minute) + " minutes";
  if (seconds < day) return Math.round(seconds / hour) + " hours";
  if (seconds < year) return Math.round(seconds / day) + " days";

  const years = seconds / year;
  if (years >= 1e9) return "billions of years";
  if (years >= 1e6) return "millions of years";
  if (years >= 1000) return "thousands of years";
  return Math.round(years).toLocaleString() + " years";
}
    box.addEventListener("input", function () {
      const pw = box.value;
      clearTimeout(timer);

      if (pw.length === 0) {
        document.getElementById("crack").textContent = "";
        result.textContent = "Start typing...";
        document.getElementById("tips").innerHTML = "";
        bar.style.width = "0%";
        breach.textContent = "";
        return;
      }

      let score = 0;
      if (pw.length >= 8) score++;
      if (pw.length >= 12) score++;
      if (/[a-z]/.test(pw)) score++;
      if (/[A-Z]/.test(pw)) score++;
      if (/[0-9]/.test(pw)) score++;
      if (/[^a-zA-Z0-9]/.test(pw)) score++;

      let rating, color;
      if (score <= 2) { rating = "Weak"; color = "red"; }
      else if (score <= 4) { rating = "Okay"; color = "orange"; }
      else { rating = "Strong"; color = "green"; }
      const tips = [];
if (pw.length < 12) tips.push("Make it at least 12 characters long");
if (!/[a-z]/.test(pw)) tips.push("Add a lowercase letter");
if (!/[A-Z]/.test(pw)) tips.push("Add a capital letter");
if (!/[0-9]/.test(pw)) tips.push("Add a number");
if (!/[^a-zA-Z0-9]/.test(pw)) tips.push("Add a symbol like ! or @");

const tipsList = document.getElementById("tips");
tipsList.innerHTML = "";
for (const tip of tips) {
  const li = document.createElement("li");
  li.textContent = tip;
  tipsList.appendChild(li);
}
    document.getElementById("crack").textContent = "Estimated time to crack: " + crackTime(pw);
      bar.style.width = (score / 6 * 100) + "%";
      bar.style.background = color;
      result.textContent = rating + " (score " + score + " out of 6)";

      // Wait half a second after typing stops, then check breaches
      timer = setTimeout(function () { checkBreach(pw); }, 500);
    });
  </script>
</body>
</html>
